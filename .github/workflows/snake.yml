name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually too
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ClashLex
          outputs: |
            dist/github-snake.svg?color_snake=#d32f2f&color_dots=#ebedf0,#ffebcc,#ffc299,#ff9966,#ff5500
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff6600&color_dots=#161b22,#501b1b,#8b2626,#cc5a01,#ffcc00

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
