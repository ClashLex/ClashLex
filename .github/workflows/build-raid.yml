name: build-raid

# Rebuilds the published V2 README animation whenever its sources change.
on:
  push:
    paths:
      - "raid/make_raid.py"
      - "raid/make_raid_v2.py"
      - "raid/assemble_v2.py"
      - "raid/_v2_acts_2_3.py"
      - "raid/_v2_act4.py"
      - "raid/_v2_act5.py"
      - "raid/_v2_act6.py"
      - "raid/test_raid_v2.py"
      - ".github/workflows/build-raid.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reference font and build dependency
        run: |
          python -m pip install Pillow
          sudo apt-get update
          sudo apt-get install --yes fonts-liberation
      - name: Assemble V2 generator
        run: python raid/assemble_v2.py
      - name: Test timing, geometry and CLI
        run: python -m unittest discover -s raid -p "test_*.py"
      - name: Generate and validate SVGs
        run: python raid/make_raid_v2.py
      - name: Verify deterministic assets
        run: python raid/make_raid_v2.py --check
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add raid/raid-light.svg raid/raid-dark.svg raid/raid-light-static.svg raid/raid-dark-static.svg raid/validation.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "rebuild raid animation"
          git push
