<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>raid preview</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; }
  .panel { padding: 24px 16px; display: flex; justify-content: center; }
  .panel img { width: 100%; max-width: 830px; height: auto; display: block; }
  .light { background: #ffffff; color: #1f2328; }
  .dark  { background: #0d1117; color: #e6edf3; }
  p { margin: 0; padding: 8px 16px 0; text-align: center; opacity: .6; }
</style>
</head>
<body>
  <div class="light"><p>light</p><div class="panel"><img src="raid-light.svg" alt="light"></div></div>
  <div class="dark"><p>dark</p><div class="panel"><img src="raid-dark.svg" alt="dark"></div></div>
</body>
</html>
